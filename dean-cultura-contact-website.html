<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connect with Dean Cultura through Instagram, Facebook, TikTok, or email.">
  <title>Dean Cultura | Connect With Me</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(20, 28, 49, .82);
      --text: #f4f6ff;
      --muted: #aab4cc;
      --accent: #9b8cff;
      --line: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(117, 91, 255, .22), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgba(35, 184, 190, .15), transparent 35%),
        var(--bg);
    }
    .card {
      width: min(100%, 480px);
      padding: 42px 30px 30px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }
    .avatar {
      width: 88px; height: 88px; margin: 0 auto 20px;
      display: grid; place-items: center;
      border-radius: 28px;
      color: white; font-size: 30px; font-weight: 800;
      background: linear-gradient(135deg, #9b8cff, #4fc6c8);
      box-shadow: 0 10px 30px rgba(123, 111, 255, .28);
    }
    .eyebrow {
      margin: 0 0 8px; color: #b9b0ff;
      font-size: 12px; font-weight: 800; letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 40px); letter-spacing: -.04em; }
    .intro { margin: 12px auto 28px; max-width: 330px; color: var(--muted); line-height: 1.6; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      min-height: 62px; padding: 13px 17px;
      color: var(--text); text-decoration: none; text-align: left;
      border: 1px solid var(--line); border-radius: 16px;
      background: rgba(255,255,255,.045);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .link:hover { transform: translateY(-3px); border-color: rgba(155,140,255,.7); background: rgba(155,140,255,.1); }
    .icon {
      width: 36px; height: 36px; flex: 0 0 36px;
      display: grid; place-items: center; border-radius: 11px;
      background: rgba(255,255,255,.09); font-size: 17px;
    }
    .label { display: block; font-weight: 700; }
    .handle { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .arrow { margin-left: auto; color: var(--muted); font-size: 20px; }
    footer { margin-top: 28px; color: #77829d; font-size: 12px; }
    @media (max-width: 380px) { .card { padding: 34px 20px 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">DC</div>
    <p class="eyebrow">LET'S CONNECT</p>
    <h1>Dean Cultura</h1>
    <p class="intro">Welcome to my little corner of the internet. Find me on social media or send me an email.</p>

    <nav class="links" aria-label="Social media and contact links">
      <a class="link" href="https://www.instagram.com/ilovewahffles/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◎</span>
        <span><span class="label">Instagram</span><span class="handle">@ilovewahffles</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.facebook.com/profile.php?id=61573637552425" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">f</span>
        <span><span class="label">Facebook</span><span class="handle">Connect with me</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.tiktok.com/@kyunyow" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">♪</span>
        <span><span class="label">TikTok</span><span class="handle">@kyunyow</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="mailto:deancultura@gmail.com">
        <span class="icon" aria-hidden="true">✉</span>
        <span><span class="label">Email</span><span class="handle">deancultura@gmail.com</span></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>© <span id="year"></span> Dean Cultura · Made with care</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
